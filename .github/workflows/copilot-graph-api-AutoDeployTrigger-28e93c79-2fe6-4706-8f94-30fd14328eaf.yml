name: Trigger auto deployment for copilot-graph-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/copilot-graph-api-AutoDeployTrigger-28e93c79-2fe6-4706-8f94-30fd14328eaf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.COPILOTGRAPHAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.COPILOTGRAPHAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.COPILOTGRAPHAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.COPILOTGRAPHAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.COPILOTGRAPHAPI_REGISTRY_PASSWORD }}
          containerAppName: copilot-graph-api
          resourceGroup: Suhi-Container-App-demo
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


